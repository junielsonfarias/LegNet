# Workflow de CI Completo
# Lint, type-check, testes (Vitest) e build em PRs e pushes para main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Types
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      DIRECT_URL: "postgresql://test:test@localhost:5432/test"
      NEXTAUTH_SECRET: "ci-test-secret-key-not-for-production-use"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "Camara CI"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript (noImplicitAny)
        run: npx tsc --noEmit --pretty

  test:
    name: Testes (Vitest)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      DIRECT_URL: "postgresql://test:test@localhost:5432/test"
      NEXTAUTH_SECRET: "ci-test-secret-key-not-for-production-use"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "Camara CI"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Executar testes (Vitest)
        run: npx vitest run --reporter=verbose

  build:
    name: Build de producao
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      DIRECT_URL: "postgresql://test:test@localhost:5432/test"
      NEXTAUTH_SECRET: "ci-test-secret-key-not-for-production-use"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "Camara CI"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

      - name: Resumo
        if: always()
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "Build de producao concluido com sucesso." >> $GITHUB_STEP_SUMMARY
          else
            echo "Build falhou. Verifique os logs." >> $GITHUB_STEP_SUMMARY
          fi

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test"
      NEXTAUTH_SECRET: "test-secret-min-32-chars-for-ci-only-do-not-use-in-prod"
      NEXTAUTH_URL: "http://localhost:3000"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      INTERNAL_API_SECRET: "ci-internal-api-secret-not-for-production-use"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "Camara CI"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      SITE_NAME: "Camara CI"
      SITE_URL: "http://localhost:3000"
      REDIS_ENABLED: "false"
      NODE_ENV: "test"
      LOG_LEVEL: "error"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Aplicar schema no Postgres
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Seed do banco de dados
        run: npm run db:seed

      - name: Instalar navegador Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      - name: Executar smoke E2E
        run: npm run test:e2e:smoke

      - name: Upload Playwright report (apenas em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (apenas em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
