# Workflow de CI Completo
# Lint, type-check, testes (Vitest) e build em PRs e pushes para main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Types
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      DIRECT_URL: "postgresql://test:test@localhost:5432/test"
      NEXTAUTH_SECRET: "ci-test-secret-key-not-for-production-use"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "Camara CI"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript (noImplicitAny)
        run: npx tsc --noEmit --pretty

  test:
    name: Testes (Vitest)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      DIRECT_URL: "postgresql://test:test@localhost:5432/test"
      NEXTAUTH_SECRET: "ci-test-secret-key-not-for-production-use"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "Camara CI"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Executar testes (Vitest)
        run: npx vitest run --reporter=verbose

  build:
    name: Build de producao
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      DIRECT_URL: "postgresql://test:test@localhost:5432/test"
      NEXTAUTH_SECRET: "ci-test-secret-key-not-for-production-use"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "Camara CI"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

      - name: Resumo
        if: always()
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "Build de producao concluido com sucesso." >> $GITHUB_STEP_SUMMARY
          else
            echo "Build falhou. Verifique os logs." >> $GITHUB_STEP_SUMMARY
          fi
